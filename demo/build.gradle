// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "1.8.10"
    repositories {
        google()
        jcenter()
        maven { url uri('/Users/srobichaud/source/MobileSdk/android/staging/mobile-sdk-cdp-android/repository') }
        maven { url uri('/Users/srobichaud/source/MobileSdk/android/staging/MarketingCloudSdk-Android/repository') }
        maven { url "https://salesforce-marketingcloud.github.io/MarketingCloudSDK-Android/repository" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.salesforce.marketingcloud:version-safety-plugin:latest.release'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        maven { url uri('/Users/srobichaud/source/MobileSdk/android/staging/mobile-sdk-cdp-android/repository') }
        maven { url uri('/Users/srobichaud/source/MobileSdk/android/staging/MarketingCloudSdk-Android/repository') }
        maven { url "https://salesforce-marketingcloud.github.io/MarketingCloudSDK-Android/repository" }
        maven { url "https://salesforce-marketingcloud.github.io/mobile-sdk-cdp-android/repository" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}